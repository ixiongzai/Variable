name: Generate Design Tokens

on:
  push:
    branches: [main]
    paths:
      - '*.json'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run token transformation
        run: node scripts/transform.mjs

      - name: Commit generated output
        run: |
          git config user.name "Design Token Bot"
          git config user.email "design-token-bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes in output, skipping commit"
            exit 0
          fi
          git commit -m "chore: auto-generate design tokens"
          git push
